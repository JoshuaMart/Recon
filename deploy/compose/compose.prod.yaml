# The production stack, behind a Traefik already running on the host. Same components and split
# as compose.yaml, with the differences that matter on a public address:
#
#   1. Nothing publishes a port. Traefik reaches the console and API over a network it is
#      already on; everything else is reachable only inside this project.
#   2. The control plane reaches the rendering side over a network of its own, not the host
#      gateway: the local file's published port and host.docker.internal work only because
#      Docker Desktop proxies to loopback, while on a Linux engine bridge-to-bridge traffic is
#      dropped by DOCKER-ISOLATION-STAGE-2 after the DNAT.
#   3. The database has no port on the host and no route off this project.
#
# From the repository root, on the deployment host:
#   make prod-config    # resolves the environment, and names what is missing
#   make prod-up
#
# Given up on purpose: on the render network the fingerprinter resolves `controlplane` by name,
# which it cannot locally. One host cannot express a one-directional link, and the alternative
# is an iptables rule the stack silently depends on until the next reboot.
#
# Still enforced, each checked against this file by topology_test.go:
#   - the rendering side shares no network with the database, so an SSRF past the
#     fingerprinter's guard reaches an API asking for a credential it lacks, not PostgreSQL;
#   - the rendering side holds no credential: everything arrives in the scan request;
#   - the browser, the one process here running code a target wrote, is on the scan network and
#     nothing else, reaching neither control plane, database nor console.

name: recon

networks:
  # The inventory and everything allowed to reach it: the database, the
  # migrations, the control plane and the console.
  control:
  # The control plane's only call into the rendering side. Internal, with no route to the
  # internet (the two services on it have their own; a NATing bridge would be an unwanted
  # second exit).
  #
  # Chrome is not on it: that is the line that matters, since Chrome runs the target's JavaScript.
  render:
    internal: true
  # The rendering service, its browser, and the Certificate Transparency feed.
  # Their egress, and nothing else.
  scan:
  # Traefik's own network, created outside this project. Only the two services
  # that answer a public hostname join it.
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}

volumes:
  pgdata:

# Container logs are the one thing here growing without bound. A daemon-wide setting would
# work, but this way the stack does not depend on the host having one.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Deliberately absent: security_opt: no-new-privileges. It is unusable on the host this was
# written for: Docker there is the Canonical snap, so the daemon is AppArmor confined, and a
# container starting with no_new_privs cannot make the profile transition exec needs. Every
# container becomes a restart loop saying "operation not permitted", whatever the image.
#
#   docker run --rm --security-opt no-new-privileges:true alpine true
#
# says which side the fault is on before deploying: it exits 0 on Docker from its own apt
# repository and prints the refusal on a snap. cap_drop below works, so services needing no
# capability still declare it.

# The browser, three times over, differing by name only: control_urls in fingerprinter.yml
# makes them a pool, and the scan network they are alone on makes them safe.
#
# Their logs are noisy and capped, not discarded. The local file discards them because a
# browser failing to start is one someone is watching; here it came up as a container
# restarting every two seconds with `docker logs` saying the driver cannot read, the one
# thing an operator must never be told about a service that is down.
x-chrome: &chrome
  networks: [scan]
  image: ${CHROME_IMAGE:-chromedp/headless-shell:latest}
  init: true
  shm_size: '1g'
  command:
    - --remote-allow-origins=*
    - --disable-dev-shm-usage
    - --disable-gpu
    - --disable-background-networking
    - --disable-default-apps
    - --disable-extensions
    - --disable-sync
    - --no-first-run
    - --metrics-recording-only
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "2"
  healthcheck:
    test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9222' 2>/dev/null"]
    interval: 5s
    timeout: 3s
    retries: 10
    start_period: 10s
  restart: unless-stopped

services:
  postgres:
    networks: [control]
    image: postgres:18-alpine
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-asm_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-recon}
      # Read at initdb and ignored afterwards: decided once on first start, not changeable on an
      # existing cluster by editing this line. Checksums turn silent corruption in the storage
      # below into an error naming the page.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      # Continuous archiving, on from the first start. Enabling it later needs a restart and a
      # fresh base backup, which gets postponed until the day it is needed.
      - postgres
      - -c
      - archive_mode=off
      - -c
      - archive_command=test ! -f /archive/wal/%f && cp %p /archive/wal/%f
      - -c
      - wal_level=replica
      # A cold restore needs the WAL that follows the base backup, and the
      # default keeps too little to survive a slow one.
      - -c
      - max_wal_size=1GB
    # No ports. The only clients are on the control network, and psql for an
    # operator is `docker compose exec`, which needs no listener on the host.
    volumes:
      # Mounted at /var/lib/postgresql, not its data subdirectory: the official image recommends
      # this from 18 on so a later pg_upgrade --link avoids a mount point boundary.
      - pgdata:/var/lib/postgresql
      # An absolute path on the deployment host, not a directory in the checkout: the half of the
      # backup a redeploy must not be able to remove.
      #
      # If this becomes a bucket, archive_command above needs egress, which the control network
      # has and the render network does not.
      - ${BACKUP_ARCHIVE_DIR:?set BACKUP_ARCHIVE_DIR to an absolute path on the host}:/archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-asm_owner} -d ${POSTGRES_DB:-recon}"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    # Postgres wants its shutdown to be the fast one rather than the immediate
    # one, and ten seconds is not enough for a busy cluster to write it out.
    stop_grace_period: 1m
    restart: unless-stopped

  # The archive directory must exist and be writable by postgres before the first
  # archive_command fires, or every WAL segment fails to ship with only a log line to show it.
  archive-init:
    networks: [control]
    image: postgres:18-alpine
    user: root
    entrypoint: ["sh", "-c"]
    command: ["mkdir -p /archive/wal /archive/base && chown -R postgres:postgres /archive"]
    volumes:
      - ${BACKUP_ARCHIVE_DIR:?set BACKUP_ARCHIVE_DIR to an absolute path on the host}:/archive
    restart: "no"

  # A service of its own, not a control-plane step, so a failed migration is readable and the
  # application is gated on it by the deployment, not a remembered ordering.
  migrate:
    networks: [control]
    logging: *logging
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
      target: migrate
      args:
        VERSION: ${VERSION:-prod}
    command: ["up"]
    environment:
      RECON_DATABASE__MIGRATION_URL: >-
        postgres://${POSTGRES_USER:-asm_owner}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-recon}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # The migration creates the roles NOLOGIN with their privileges and stops. LOGIN and a
  # secret are the deployment's job, so no password lives in a migration file.
  db-app-role:
    networks: [control]
    image: postgres:18-alpine
    entrypoint: ["sh", "-c"]
    # Through stdin, not -c: psql does not interpolate variables in -c. Passwords go in as psql
    # variables so they never reach a command line ps could show.
    #
    # Two roles, two passwords: what separates them is what row-level security lets them see, and
    # one shared credential would reduce that to a comment.
    command:
      - >-
        printf '%s;\n%s;\n'
        "ALTER ROLE asm_app WITH LOGIN PASSWORD :'pw'"
        "ALTER ROLE asm_sys WITH LOGIN PASSWORD :'syspw'"
        | psql -v ON_ERROR_STOP=1 -v pw="$$APP_PASSWORD" -v syspw="$$SYSTEM_PASSWORD"
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-asm_owner}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-recon}
      APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD}
      SYSTEM_PASSWORD: ${SYSTEM_PASSWORD:?set SYSTEM_PASSWORD}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # Reference data, reapplied on every deployment, not a one-off migration: the denylist grows
  # with new frameworks and edges. It runs as the owner, as the application role cannot write it.
  seed:
    networks: [control]
    logging: *logging
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
      target: migrate
      args:
        VERSION: ${VERSION:-prod}
    command: ["seed"]
    environment:
      RECON_DATABASE__MIGRATION_URL: >-
        postgres://${POSTGRES_USER:-asm_owner}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-recon}?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # The operational command line, run rather than served. Behind a profile so `make prod-up`
  # does not start it: a container exiting at once mid-stack reads as a crash.
  #
  # It holds the owner credential, which is why it is not a route.
  recon:
    profiles: [tools]
    networks: [control]
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
      target: recon
      args:
        VERSION: ${VERSION:-prod}
    environment:
      RECON_DATABASE__MIGRATION_URL: >-
        postgres://${POSTGRES_USER:-asm_owner}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-recon}?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  controlplane:
    networks: [control, render, traefik]
    logging: *logging
    # A static binary in a distroless image needs none; dropping them here means the deployment
    # says so instead of trusting the base image to keep saying so.
    cap_drop: [ALL]
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
      target: controlplane
      args:
        VERSION: ${VERSION:-prod}
    environment:
      RECON_ENV: prod
      RECON_HTTP__ADDR: ":8080"
      # asm_app, never the owner. RECON_DATABASE__MIGRATION_URL is absent on purpose and the
      # configuration refuses to start if it appears: role separation buys nothing if whoever gets
      # execution here finds the owner credentials beside the application ones.
      RECON_DATABASE__URL: >-
        postgres://asm_app:${APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-recon}?sslmode=disable
      # The second pool. The loops serving every tenant in a tick use the role allowed past
      # row-level security and say so by holding this credential, not by omitting a filter. Both are
      # required: with one, those loops read zero rows and look healthy.
      RECON_DATABASE__SYSTEM_URL: >-
        postgres://asm_sys:${SYSTEM_PASSWORD}@postgres:5432/${POSTGRES_DB:-recon}?sslmode=disable
      # What makes a run's credentials unforgeable. There is nothing to store
      # and nothing to revoke because everything rests on this.
      RECON_SECURITY__SIGNING_KEY: ${SIGNING_KEY:?set SIGNING_KEY}
      # Optional. A deployment without a database is normal, and the console is told which it is
      # rather than guessing from data that looks the same either way.
      RECON_ENRICH__CITY_DATABASE: ${GEOIP_CITY_DATABASE:-}
      RECON_ENRICH__ASN_DATABASE: ${GEOIP_ASN_DATABASE:-}
      # Where a run comes back to, for its target list and report. The scanner is a serverless job
      # on someone else's network, so this must be the public name, derived from the router below,
      # not configured twice: a value disagreeing with the route shows as a scanner unable to fetch
      # targets, far from where the mistake was made.
      RECON_VERIFICATION__PUBLIC_URL: https://${API_HOST:?set API_HOST to the public hostname of the API}
      # Service names, which the render network puts within reach. An empty string turns that side
      # off, and both are normal: without the renderer, assets keep their due dates and nothing
      # pretends to have looked; without the feed, periodic enumeration still walks every perimeter.
      RECON_RENDER__URL: http://fingerprinter:3001
      RECON_CT__URL: ws://certstream:8080/
      # How a run is started. "none" renders the definition and starts nothing,
      # which is not what a deployment on a public address usually wants.
      RECON_RUNNER__PROVIDER: ${RUNNER_PROVIDER:-none}
      RECON_RUNNER__REGION: ${RUNNER_REGION:-fr-par}
      RECON_RUNNER__JOB_ID: ${RUNNER_JOB_ID:-}
      RECON_RUNNER__SECRET_KEY: ${RUNNER_SECRET_KEY:-}
      RECON_NOTIFY__WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      RECON_NOTIFY__MIN_PRIORITY: ${NOTIFY_MIN_PRIORITY:-low}
      # The tunables, passed through by name, not mapped with a default.
      #
      # The form matters. `RECON_X: ${X:-}` delivers an unset variable as an empty string, and an
      # empty duration is a decode error stopping the process, so the stack would refuse to start for
      # an unset optional value. `RECON_X: ${X:-72h}` keeps the default in two places, drifting.
      # With no value, an unset variable is absent from the container and the default in
      # internal/config applies, the one place it is written.
      RECON_LOG__LEVEL:
      RECON_VERIFICATION__RESOLVE:
      RECON_VERIFICATION__FULL:
      RECON_VERIFICATION__FINGERPRINT:
      RECON_VERIFICATION__RENDER_SOLE:
      RECON_VERIFICATION__RENDER_RECOVERY:
      RECON_VERIFICATION__RENDER_BLIND:
      RECON_VERIFICATION__INACTIVE:
      RECON_VERIFICATION__JITTER:
      RECON_VERIFICATION__FULL_FLOOR:
      RECON_VERIFICATION__BATCH_SIZE:
      RECON_VERIFICATION__SWEEP_INTERVAL:
      RECON_VERIFICATION__TIMEOUT:
      RECON_VERIFICATION__REPORT_TIMEOUT:
      RECON_VERIFICATION__DISCOVERY_RETRY:
      RECON_VERIFICATION__PORTS:
      RECON_CT__INTERVAL:
      RECON_CT__CEILING:
      RECON_CT__WINDOW:
      RECON_CT__CACHE_TTL:
      RECON_CT__CACHE_SIZE:
      RECON_RENDER__INTERVAL:
      RECON_RENDER__BATCH:
      RECON_RENDER__CONCURRENCY:
      RECON_RENDER__COST:
      RECON_RENDER__TIMEOUT:
      RECON_NOTIFY__INTERVAL:
      RECON_EXTERNAL__INTERVAL:
      RECON_MAINTENANCE__INTERVAL:
    volumes:
      - ${GEOIP_DIR:-../../var/geoip}:/geoip:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.recon-api.rule=Host(`${API_HOST}`)"
      - "traefik.http.routers.recon-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.recon-api.middlewares=security-headers@file"
      - "traefik.http.services.recon-api.loadbalancer.server.port=8080"
      # Named, not inferred: this container is on three networks and Traefik picks one to dial; the
      # wrong one reaches nothing and the route answers 502 with nothing in the access log.
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"
    depends_on:
      db-app-role:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/controlplane", "-health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    # Longer than the configured shutdown timeout, so a redeploy lets requests
    # in flight finish instead of being the thing that ends them.
    stop_grace_period: 45s
    restart: unless-stopped

  # The console. On the control network, nowhere near the rendering one: it is the only other
  # process talking to the control plane, and it holds a credential where the renderer holds none.
  #
  # It holds no database credential either, the decision behind the whole component. It
  # reaches the control plane over HTTP with the organization's token like any API client, so a
  # bug here cannot become a write to the inventory.
  console:
    networks: [control, traefik]
    logging: *logging
    cap_drop: [ALL]
    build:
      context: ../..
      dockerfile: web/Dockerfile
    environment:
      # Over the control network, not Traefik. The browser never calls this address: every request
      # goes through the console's own server, which adds the Authorization header.
      RECON_API_URL: http://controlplane:8080
      # The node adapter compares a POST's Origin header against the origin it believes it serves,
      # and without this infers it badly, rejecting legitimate POSTs (the login screen included) at
      # the first form, not at startup. Derived from the router below, like the API's public URL.
      ORIGIN: https://${CONSOLE_HOST:?set CONSOLE_HOST to the public hostname of the console}
      PORT: "3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.recon-console.rule=Host(`${CONSOLE_HOST}`)"
      - "traefik.http.routers.recon-console.tls.certresolver=letsencrypt"
      - "traefik.http.routers.recon-console.middlewares=security-headers@file"
      - "traefik.http.services.recon-console.loadbalancer.server.port=3000"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"
    depends_on:
      controlplane:
        condition: service_healthy
    restart: unless-stopped

  # The browsers the rendering service drives over CDP, three, the one kind of process here
  # running code someone else wrote. On the scan network and nothing else, so they reach only
  # the internet and the service driving them.
  #
  # Three because the pool in fingerprinter.yml says so, not by preference: control_urls lists
  # them by name, so a container added here and not there is never used, and the reverse is a pool
  # dialling a name that does not resolve. Both stacks mount that file, so they cannot drift.
  chrome-1:
    <<: *chrome
  chrome-2:
    <<: *chrome
  chrome-3:
    <<: *chrome

  # The Certificate Transparency feed. An aggregator following the public logs and serving a
  # websocket, deployed as an image like FastRecon; the matcher walking the apex set is a loop in
  # the control plane, not a second service.
  #
  # It parses X.509 anyone can get logged, so its input is others' and it stays on the scan
  # network. The control plane dials it over the render network and it never dials back.
  certstream:
    networks: [scan, render]
    image: ghcr.io/d-rickyy-b/certstream-server-go:v1.9.0
    logging: *logging
    volumes:
      - ./certstream.yml:/app/config/config.yaml:ro
    restart: unless-stopped

  # Renders pages a target controls, so it sits with its browser and holds no credential. All it
  # needs arrives in the request, making "holds nothing" a shape, not a promise: no variable to
  # leak.
  #
  # :latest moves on `make prod-pull`. Pin FINGERPRINTER_IMAGE to a digest or release tag if a
  # deployment should change only when someone decides.
  fingerprinter:
    networks: [scan, render]
    image: ${FINGERPRINTER_IMAGE:-ghcr.io/joshuamart/fingerprinter:latest}
    logging: *logging
    volumes:
      - ./fingerprinter.yml:/app/config.yml:ro
    depends_on:
      chrome-1:
        condition: service_healthy
    restart: unless-stopped
