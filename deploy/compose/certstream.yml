# The CT feed. Pinned here, not left to the image's default: the three endpoint paths are a
# contract the matcher dials, and an image changing them would move the socket under a client
# that notices only by receiving nothing.
#
# It holds no credential and needs none; everything it reads is public.

webserver:
  listen_addr: "0.0.0.0"
  listen_port: 8080
  real_ip: false
  # The three shapes it serves. Recon dials the lite one: it carries the SANs and issuer (a
  # candidate's lineage) and omits the DER nothing here parses.
  full_url: "/full-stream"
  lite_url: "/"
  domains_only_url: "/domains-only"
  cert_path: ""
  cert_key_path: ""
  compression_enabled: false

prometheus:
  enabled: false

general:
  disable_default_logs: false
  drop_old_logs: true

  # Messages queued per client before the feed skips certificates for it. The default of
  # 300 is about 110 ms of stream: in production, VM steal stalled the matcher longer than
  # that, losing about 1 % of certificates. 20 000 is about 7 s, held only while it lags.
  buffer_sizes:
    websocket: 20000

  # Off, by decision. This resumes the aggregator's own reading of the logs after a restart, not
  # the gap a disconnected matcher has: there is no per-client buffer either way, so that window
  # is lost whatever this says. Turning it on replays everything since the stored index on every
  # restart, which upstream documents as up to ten thousand certificates a second. The
  # per-programme ceiling would hold, but would spend the whole window holding.
  recovery:
    enabled: false
    ct_index_file: "/app/config/ct_index.json"
