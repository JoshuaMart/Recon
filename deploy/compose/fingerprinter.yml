# The rendering service's configuration, mounted into its container: the
# published image ships its detections but no config file.
#
# Nothing here is a credential, and that is the point. The service holds none:
# everything it needs to do its job arrives in the scan request.

server:
  port: 3001
  read_timeout: 10s

scanner:
  max_redirects: 10
  request_timeout: 30s
  headers:
    User-Agent: "Recon/1.0"
  concurrent_scans: 60
  # A pool at capacity frees a slot within seconds, so refusing on the spot
  # turns a busy service into a retry storm. Waiting without a ceiling is worse:
  # the caller spends its own budget queueing.
  acquire_timeout: 5s

browser:
  # Three, and the same three in both stacks. This file is mounted by the local
  # compose file and by the deployed one, so the pool cannot be sized for one
  # and not the other, and a name here that no container answers to is a pool
  # dialling nowhere.
  #
  # The local stack pays for that. Milestone 0 asks that `make up` comes up in
  # under sixty seconds on a clean machine, and three Chrome containers is most
  # of that budget on a cold image. The alternative was a local pool that does
  # not look like the deployed one, and a concurrency setting nobody exercises
  # until it is in production.
  control_urls:
    - "http://chrome-1:9222"
    - "http://chrome-2:9222"
    - "http://chrome-3:9222"
  # Above concurrent_scans, and by a margin: this is a safety limit rather than
  # the admission gate. If it binds first, saturation reaches the caller as a
  # scan that timed out instead of a refusal it could retry. Three times the
  # admission gate, which is the ratio it had at twenty and sixty.
  max_pages: 180
  page_timeout: 15s

detections:
  yaml_dir: "./detections/"
