# The renderer's configuration. It holds no credential: everything a scan needs
# arrives in the request.
server:
  port: 3001
  read_timeout: 10s

scanner:
  max_redirects: 10
  request_timeout: 30s
  scan_timeout: 90s
  headers:
    User-Agent: "Recon/1.0"
  # Recon's render concurrency stays below this, and backs off on a 429.
  concurrent_scans: 60
  acquire_timeout: 5s

browser:
  control_urls:
    - "http://chrome-1:9222"
    - "http://chrome-2:9222"
    - "http://chrome-3:9222"
  # About three times concurrent_scans, so saturation shows as a 429 rather than a timeout.
  max_pages: 180
  page_timeout: 15s

detections:
  yaml_dir: "./detections/"
