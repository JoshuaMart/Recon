# The rendering service's configuration, mounted into its container: the published image ships
# its detections but no config file.
#
# Nothing here is a credential, deliberately: the service holds none, and everything it needs
# arrives in the scan request.

server:
  port: 3001
  read_timeout: 10s

scanner:
  max_redirects: 10
  request_timeout: 30s
  headers:
    User-Agent: "Recon/1.0"
  concurrent_scans: 60
  # A pool at capacity frees a slot within seconds, so refusing on the spot turns a busy service
  # into a retry storm; waiting without a ceiling is worse, as the caller spends its own budget
  # queueing.
  acquire_timeout: 5s

browser:
  # Three, the same in both stacks: both compose files mount this one, so the pool cannot be
  # sized for one only, and a name no container answers to is a pool dialling nowhere.
  #
  # The local stack pays for that: three Chrome containers are most of the sixty-second `make up`
  # budget on a cold image. The alternative was a local pool unlike the deployed one and a
  # concurrency setting nobody exercises until production.
  control_urls:
    - "http://chrome-1:9222"
    - "http://chrome-2:9222"
    - "http://chrome-3:9222"
  # Above concurrent_scans by a margin: a safety limit, not the admission gate. If it bound first,
  # saturation would reach the caller as a timed-out scan instead of a retryable refusal. Three
  # times the admission gate, the ratio it had at twenty and sixty.
  max_pages: 180
  page_timeout: 15s

detections:
  yaml_dir: "./detections/"
