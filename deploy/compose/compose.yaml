# The local stack. Milestone 0 asks that this comes up in under sixty seconds
# on a clean machine, so images are pinned to a minor tag and data lives in
# named volumes: a bind mount for the data directory is ruinously slow on
# macOS.
#
# From the repository root:
#   make up
#
# What is deliberately not here: a scanner. FastRecon is a one-shot job, not a
# daemon. It is an image a run starts, with its perimeter supplied as overrides
# on the start call, so there is nothing for it to listen to.

name: recon

networks:
  # The inventory and everything allowed to reach it.
  control:
  # The rendering service and its browser, and nothing else. A headless browser
  # executing target-controlled JavaScript beside the database is an SSRF engine
  # adjacent to the inventory, so the split is the point rather than tidiness.
  scan:

volumes:
  pgdata:

# The browser, three times over. The three differ by name and by nothing else:
# what makes them a pool is control_urls in fingerprinter.yml, and what makes
# them safe is the scan network they are alone on.
x-chrome: &chrome
  networks: [scan]
  image: chromedp/headless-shell:latest
  init: true
  shm_size: '1g'
  command:
    - --remote-allow-origins=*
    - --disable-dev-shm-usage
    - --disable-gpu
    - --disable-background-networking
    - --disable-default-apps
    - --disable-extensions
    - --disable-sync
    - --no-first-run
    - --metrics-recording-only
  logging:
    driver: "none"
  healthcheck:
    test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9222' 2>/dev/null"]
    interval: 3s
    timeout: 3s
    retries: 10
    start_period: 5s
  restart: unless-stopped

services:
  postgres:
    networks: [control]
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-asm_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-recon}
    command:
      # Continuous archiving, on from the first start. Turning it on later
      # needs a restart and a fresh base backup, which is the kind of thing
      # that gets postponed until the day it is needed.
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /archive/wal/%f && cp %p /archive/wal/%f
      - -c
      - wal_level=replica
      # A cold restore needs the WAL that follows the base backup, and the
      # default keeps too little to survive a slow one.
      - -c
      - max_wal_size=1GB
    # Bound to the loopback interface. Published without a host this listens on
    # every interface of the machine, which on a shared network is an open
    # PostgreSQL port.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Mounted at /var/lib/postgresql rather than at its data subdirectory:
      # the official image recommends this from 18 onwards so a later
      # pg_upgrade --link does not run into a mount point boundary.
      - pgdata:/var/lib/postgresql
      # The archive destination is configuration (13.3). A path here, a bucket
      # in production, and the restore is exercised against whichever it is.
      - ${BACKUP_ARCHIVE_DIR:-../../var/archive}:/archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-asm_owner} -d ${POSTGRES_DB:-recon}"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s

  # The archive directory has to exist and be writable by postgres before the
  # first archive_command fires, or every WAL segment fails to ship and the
  # only sign is a line in the log.
  archive-init:
    networks: [control]
    image: postgres:18-alpine
    user: root
    entrypoint: ["sh", "-c"]
    command: ["mkdir -p /archive/wal /archive/base && chown -R postgres:postgres /archive"]
    volumes:
      - ${BACKUP_ARCHIVE_DIR:-../../var/archive}:/archive
    restart: "no"

  # A service of its own rather than a step inside the control plane, so a
  # failed migration is readable and the application is gated on it by the
  # deployment rather than by an ordering somebody has to remember.
  migrate:
    networks: [control]
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
      target: migrate
    command: ["up"]
    environment:
      RECON_LOG__FORMAT: text
      RECON_DATABASE__MIGRATION_URL: >-
        postgres://${POSTGRES_USER:-asm_owner}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-recon}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # The migration creates the roles NOLOGIN with their privileges and stops
  # there. Granting LOGIN and a secret is the deployment's job, so that no
  # password ever lives in a migration file.
  db-app-role:
    networks: [control]
    image: postgres:18-alpine
    entrypoint: ["sh", "-c"]
    # Through stdin rather than -c: psql does not interpolate variables in -c.
    # The passwords go in as psql variables so they never reach a command line
    # that ps could show.
    #
    # The two roles get two passwords. What separates them is what row-level
    # security lets them see, so one shared credential would turn that
    # distinction into a comment.
    #
    # The semicolons are not decoration: a newline does not end a statement for
    # psql, so without them the second ALTER reads as a continuation of the
    # first and the whole thing is a syntax error.
    command:
      - >-
        printf '%s;\n%s;\n'
        "ALTER ROLE asm_app WITH LOGIN PASSWORD :'pw'"
        "ALTER ROLE asm_sys WITH LOGIN PASSWORD :'syspw'"
        | psql -v ON_ERROR_STOP=1 -v pw="$$APP_PASSWORD" -v syspw="$$SYSTEM_PASSWORD"
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-asm_owner}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-recon}
      APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD in .env}
      SYSTEM_PASSWORD: ${SYSTEM_PASSWORD:?set SYSTEM_PASSWORD in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # Reference data, reapplied on every deployment rather than by a one-off
  # migration: the denylist grows as new frameworks and edges appear. It runs
  # as the owner, because the application role has no write on that table.
  seed:
    networks: [control]
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
      target: migrate
    command: ["seed"]
    environment:
      RECON_LOG__FORMAT: text
      RECON_DATABASE__MIGRATION_URL: >-
        postgres://${POSTGRES_USER:-asm_owner}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-recon}?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # The operational command line, run rather than served. Behind a profile so
  # `make up` does not start it: it is a command somebody invokes, and a
  # container that exits immediately in the middle of a stack reads as a crash.
  #
  # It holds the owner credential, which is the whole reason it is not a route.
  recon:
    profiles: [tools]
    networks: [control]
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
      target: recon
    environment:
      RECON_LOG__FORMAT: text
      RECON_DATABASE__MIGRATION_URL: >-
        postgres://${POSTGRES_USER:-asm_owner}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-recon}?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  controlplane:
    networks: [control]
    # The control plane calls the rendering service and the rendering service
    # never calls back. A bridge cannot express that: joining `scan` would let
    # the browser side resolve `postgres` and `controlplane` by name, which is
    # the one thing the split exists to prevent. So the call goes out through
    # the host gateway to the port the renderer publishes on loopback, which is
    # the path verify-isolation.sh already names rather than claims away.
    #
    # In production the two are a plain URL and a firewall rule, and this line
    # disappears with the bridge.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
      target: controlplane
    environment:
      RECON_ENV: dev
      RECON_LOG__FORMAT: text
      RECON_HTTP__ADDR: ":8080"
      # asm_app, never the owner. RECON_DATABASE__MIGRATION_URL is deliberately
      # absent, and the configuration refuses to start if it appears: role
      # separation buys nothing if whoever reaches execution here finds the
      # owner credentials next to the application ones.
      RECON_DATABASE__URL: >-
        postgres://asm_app:${APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-recon}?sslmode=disable
      # The second pool. The loops that serve every tenant in one tick connect
      # with the role that is allowed past row-level security, and they say so
      # by holding this credential rather than by omitting a filter. Both are
      # required: with one credential those loops read zero rows and look
      # healthy doing it.
      RECON_DATABASE__SYSTEM_URL: >-
        postgres://asm_sys:${SYSTEM_PASSWORD}@postgres:5432/${POSTGRES_DB:-recon}?sslmode=disable
      # What makes a run's credentials unforgeable. There is nothing to store
      # and nothing to revoke because everything rests on this.
      RECON_SECURITY__SIGNING_KEY: ${SIGNING_KEY:?set SIGNING_KEY in .env}
      # Optional. A deployment with no database is a normal deployment, and the
      # console is told which of the two it is rather than guessing from data
      # that looks the same either way.
      RECON_ENRICH__CITY_DATABASE: ${GEOIP_CITY_DATABASE:-}
      RECON_ENRICH__ASN_DATABASE: ${GEOIP_ASN_DATABASE:-}
      # Where a run comes back to. Not derivable from the listen address: the
      # scanner runs somewhere else entirely, and a definition that named
      # nowhere would surface as a scanner unable to fetch its targets rather
      # than as a missing setting.
      RECON_VERIFICATION__PUBLIC_URL: ${PUBLIC_URL:-http://controlplane:8080}
      RECON_RENDER__URL: ${RENDER_URL:-http://host.docker.internal:3001}
      # The Certificate Transparency aggregator, reached the same way and for
      # the same reason: it sits on the scan network, so the call goes out
      # through the host gateway rather than by service name. Empty turns the
      # matcher off, which is a normal deployment.
      RECON_CT__URL: ${CT_URL:-ws://host.docker.internal:3002/}
      # How a run is started. Empty is the development shape: the definition is
      # rendered and a person runs the image with it.
      RECON_RUNNER__PROVIDER: ${RUNNER_PROVIDER:-none}
      RECON_RUNNER__REGION: ${RUNNER_REGION:-fr-par}
      RECON_RUNNER__JOB_ID: ${RUNNER_JOB_ID:-}
      RECON_RUNNER__SECRET_KEY: ${RUNNER_SECRET_KEY:-}
      RECON_NOTIFY__WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      RECON_NOTIFY__MIN_PRIORITY: ${NOTIFY_MIN_PRIORITY:-low}
      # The tunables, passed through by name rather than mapped with a default.
      #
      # The form matters. Written as `RECON_X: ${X:-}` an unset variable reaches
      # the container as an empty string, and an empty duration is a decode
      # error that stops the process: the stack would refuse to start because
      # somebody did not set an optional value. Written as `RECON_X: ${X:-72h}`
      # the default lives in two places and drifts. Left without a value, an
      # unset variable is simply absent from the container and the default in
      # internal/config applies, which is the one place it is written down.
      #
      # What each of them does is in .env.example, beside the value.
      RECON_VERIFICATION__RESOLVE:
      RECON_VERIFICATION__FULL:
      RECON_VERIFICATION__FINGERPRINT:
      RECON_VERIFICATION__RENDER_SOLE:
      RECON_VERIFICATION__RENDER_RECOVERY:
      RECON_VERIFICATION__RENDER_BLIND:
      RECON_VERIFICATION__INACTIVE:
      RECON_VERIFICATION__JITTER:
      RECON_VERIFICATION__FULL_FLOOR:
      RECON_VERIFICATION__BATCH_SIZE:
      RECON_VERIFICATION__SWEEP_INTERVAL:
      RECON_VERIFICATION__TIMEOUT:
      RECON_VERIFICATION__DISCOVERY_RETRY:
      RECON_VERIFICATION__PORTS:
      RECON_CT__INTERVAL:
      RECON_CT__CEILING:
      RECON_CT__WINDOW:
      RECON_CT__CACHE_TTL:
      RECON_CT__CACHE_SIZE:
      RECON_RENDER__INTERVAL:
      RECON_RENDER__BATCH:
      RECON_RENDER__CONCURRENCY:
      RECON_RENDER__COST:
      RECON_RENDER__TIMEOUT:
      RECON_NOTIFY__INTERVAL:
      RECON_EXTERNAL__INTERVAL:
      RECON_MAINTENANCE__INTERVAL:
    volumes:
      - ${GEOIP_DIR:-../../var/geoip}:/geoip:ro
    ports:
      # Loopback by default. A deployment whose scanner runs off-host has to
      # bind this wider, and that is a decision rather than a setting: the
      # report and target-list credentials are bearer tokens, so on plain HTTP
      # they travel in the clear for the life of the run they name.
      - "${CONTROLPLANE_BIND:-127.0.0.1}:${CONTROLPLANE_PORT:-8080}:8080"
    depends_on:
      db-app-role:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/controlplane", "-health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s
    restart: unless-stopped

  # The console. On the control network and nowhere near the rendering one: it
  # is the only other process that talks to the control plane, and it holds a
  # credential where the renderer holds none.
  #
  # It holds no database credential either, which is the decision behind the
  # whole component. It reaches the control plane over HTTP with the
  # organization's token, like any other API client, so a bug here cannot become
  # a write to the inventory.
  console:
    networks: [control]
    build:
      context: ../..
      dockerfile: web/Dockerfile
    environment:
      # Where the proxy sends everything. The browser never calls this address:
      # every request goes through the console's own server, which adds the
      # Authorization header.
      RECON_API_URL: http://controlplane:8080
      # Required outside development, and the process refuses to start without
      # it. The node adapter compares the Origin header of a POST against the
      # origin it believes it serves, and without this it infers it badly: it
      # then rejects legitimate POSTs, the login screen included, and the fault
      # shows at the first form rather than at startup.
      ORIGIN: ${CONSOLE_ORIGIN:-http://localhost:3000}
      # Development, because that is what this file is. Production sets NODE_ENV
      # and the check above becomes the one that matters.
      PORT: "3000"
    ports:
      - "${CONSOLE_BIND:-127.0.0.1}:${CONSOLE_PORT:-3000}:3000"
    depends_on:
      controlplane:
        condition: service_healthy
    restart: unless-stopped

  # The browsers the rendering service drives over CDP, three of them.
  #
  # Three rather than one, and the number is the pool in fingerprinter.yml
  # rather than a preference: control_urls lists them by name, so adding a
  # container here without adding it there gives a pool that never uses it, and
  # the reverse gives a pool dialling a name that does not resolve.
  #
  # This is the one place the local stack pays for production's shape. Milestone
  # 0 asks that `make up` comes up in under sixty seconds on a clean machine,
  # and three Chrome containers is most of that budget on a cold image. The
  # alternative was a local pool that does not look like the deployed one, and a
  # concurrency setting nobody exercises until it is in production.
  chrome-1:
    <<: *chrome
  chrome-2:
    <<: *chrome
  chrome-3:
    <<: *chrome

  # The Certificate Transparency feed (7.5). An aggregator that follows the
  # public logs and serves them as a websocket, deployed as an image the way
  # FastRecon is: the matcher that walks the apex set is a loop in the control
  # plane, not a second service.
  #
  # On the scan network, for a weaker reason than the browser's and with the
  # same shape. It parses X.509 that anybody can get logged, so its input is
  # controlled by somebody else, and it has no business reaching the database.
  # The control plane dials it and it never dials back.
  certstream:
    networks: [scan]
    image: ghcr.io/d-rickyy-b/certstream-server-go:v1.9.0
    volumes:
      - ./certstream.yml:/app/config/config.yaml:ro
    ports:
      - "127.0.0.1:${CERTSTREAM_PORT:-3002}:8080"
    restart: unless-stopped

  # Renders pages controlled by a target, so it sits alone with its browser and
  # holds no credential of any kind. Everything it needs arrives in the request.
  fingerprinter:
    networks: [scan]
    image: ghcr.io/joshuamart/fingerprinter:latest
    volumes:
      - ./fingerprinter.yml:/app/config.yml:ro
    ports:
      - "127.0.0.1:${FINGERPRINTER_PORT:-3001}:3001"
    depends_on:
      chrome-1:
        condition: service_healthy
    restart: unless-stopped
