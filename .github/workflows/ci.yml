name: CI

on:
  push:
    branches: [main]
  pull_request:

# No path filter on any job here, and that is deliberate. A required check that
# is filtered by path stays pending forever on a pull request that does not
# touch those paths, and the pull request becomes unmergeable. It is the most
# common way to make "CI passes on an empty pull request" false.

permissions:
  contents: read

env:
  GO_VERSION: "1.26"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test -race ./...

  # The milestones become the regression suite, so the integration
  # infrastructure exists from the first phase rather than from the phase that
  # first needs it.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test -tags integration -count=1 ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go build -trimpath -o bin/ ./cmd/...
      - name: Images
        run: |
          for target in controlplane migrate recon; do
            docker build --target "$target" -f deploy/compose/Dockerfile -t "recon-$target:ci" .
          done

  # The console is a second toolchain in the same repository, so it gets a job
  # of its own rather than a step somebody has to remember. Its type check is
  # the only thing standing between the Go contract and the shapes the pages
  # render: nothing generates one from the other today, so a field renamed in Go
  # arrives in the browser as `undefined` and draws an empty badge.
  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run build
      - name: Image
        working-directory: .
        run: docker build -f web/Dockerfile -t recon-console:ci .

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The scan covers the history, not the checkout: a credential removed
          # in a later commit is still a credential somebody can read.
          fetch-depth: 0
      - name: Scan
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --redact --no-banner
