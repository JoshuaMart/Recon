version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - forbidigo
    - gosec
    - misspell
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - unconvert
  settings:
    errcheck:
      exclude-functions:
        - (io.ReadCloser).Close
        - (*database/sql.DB).Close
    forbidigo:
      forbid:
        - pattern: ^os\.(Getenv|LookupEnv|Environ)$
          msg: read configuration through internal/config
    gosec:
      excludes:
        - G104 # unhandled errors are errcheck's job
  exclusions:
    generated: strict
    rules:
      - path: internal/config/
        linters: [forbidigo]
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/JoshuaMart/recon
