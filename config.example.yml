# Every setting, with its default. Pass a copy with: recon serve -config config.yml
# Any value can be overridden by an environment variable: RECON_ then the path in
# upper case, with __ between levels (RECON_DATABASE__URL).

public_url: http://localhost:8080
api_key: ""            # required, at least 32 characters

http:
  addr: ":8080"

database:
  url: ""              # required, postgres://user:password@host:5432/recon

log:
  level: info          # debug, info, warn, error
  format: json         # json, text

scopes_extractor:
  url: ""              # empty disables the sync: manual programs only
  api_key: ""          # its X-API-KEY, required when url is set
  interval: 1h
  timeout: 1m
  max_removed_ratio: 0.5   # a pass archiving more of the active programs is refused

discovery:
  auto_scan: "off"     # default for programs that set none: off or on_new
  # Every run scans these, recon and verification alike.
  ports: [80, 443, 8080, 8443, 8000, 8090, 9000, 9443, 3000, 5000,
          2375, 2376, 6443, 10250, 15672, 5601, 8983, 9990, 2083, 2087,
          3306, 5432, 27017, 6379, 9200, 11211, 9042, 2379,
          3389, 5900, 1080, 3128]

verification:
  enabled: true        # periodic probing of known hosts
  batch: 500           # most hosts per run
  resolve: 24h         # nominal resolve cadence
  full: 72h            # nominal full cadence: ports and HTTP
  dormant: 168h        # inactive and unobservable hosts
  archive_after: 720h  # inactive or unobservable this long leaves the scheduler
  dead_origins:        # pages a CDN serves when the origin is gone
    - name: cloudflare origin down
      statuses: [521, 522, 523, 530]
      server: cloudflare
      title: ""

fastrecon:
  url: ""              # a `fastrecon serve` instance; empty leaves runs queued
  api_token: ""        # its FASTRECON_API_TOKEN, required when url is set
  timeout: 30m         # each run's budget
  slots: 1             # runs in flight: one per serve instance
